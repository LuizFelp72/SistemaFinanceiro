server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    # API REST: tudo em /api/ vai para o container do backend.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Frontend: ainda não é servido pelo Docker. Quando o build do Vite for
    # adicionado, copie o dist para /usr/share/nginx/html e troque este bloco por:
    #   root /usr/share/nginx/html;
    #   try_files $uri $uri/ /index.html;
    location / {
        default_type application/json;
        return 200 '{"message":"Sistema Financeiro: use /api/v1"}';
    }
}
